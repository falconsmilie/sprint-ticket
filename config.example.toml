# Documentation template only. Copy required project values into config.local.toml.
[project]
name = "PhosPy"
repo = "C:/Projects/phospy"
protected_branches = ["main", "master"]

[runner]
max_correction_rounds = 1

[codex]
executable = "codex"
model = "gpt-5.5"
reasoning_effort = "xhigh"

[[verification.commands]]
name = "tests"
argv = ["python", "-m", "pytest"]
timeout_seconds = 1800

[[verification.commands]]
name = "typing"
argv = ["pyright"]
timeout_seconds = 1800
