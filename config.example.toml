# Documentation template only. Copy required project values into config.local.toml.
# Point verification commands at the target repository's own environment.
[project]
name = "ProjectName"
repo = "C:/path/to/ProjectName"
protected_branches = ["main", "master"]

[runner]
max_correction_rounds = 1

# Agent work deadlines are provider-neutral and snapshotted when a run is created.
# Omit this table (or an individual key) to use the 3600-second default.
[agents.timeouts]
implementation_seconds = 7200
review_seconds = 5400
correction_seconds = 7200

[agents.assignments]
implementation = "codex-cli"
review = "codex-cli"
correction = "codex-cli"

[agents.providers.codex-cli]
executable = "codex"
model = "gpt-5.5"
reasoning_effort = "xhigh"

[[verification.commands]]
name = "tests"
argv = [
    "C:/path/to/ProjectName/.venv/Scripts/python.exe",
    "-m",
    "pytest"
]
timeout_seconds = 1800

[[verification.commands]]
name = "typing"
argv = [
    "C:/path/to/ProjectName/.venv/Scripts/python.exe",
    "scripts/linter.py",
]
timeout_seconds = 1800
