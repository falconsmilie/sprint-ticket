# Documentation template only. Copy required project values into config.local.toml.
# Point verification commands at the target repository's own environment.
[project]
name = "ProjectName"
repo = "C:/path/to/ProjectName"
protected_branches = ["main", "master"]

[runner]
max_correction_rounds = 1

[codex]
executable = "codex"
model = "gpt-5.5"
reasoning_effort = "xhigh"

[[verification.commands]]
name = "tests"
argv = ["C:/path/to/ProjectName/.venv/Scripts/python.exe", "-m", "pytest"]
timeout_seconds = 1800

[[verification.commands]]
name = "typing"
argv = ["C:/path/to/ProjectName/.venv/Scripts/python.exe", "-m", "pyright"]
timeout_seconds = 1800
